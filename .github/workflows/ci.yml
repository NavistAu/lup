name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mise (rust, cargo-nextest, cargo-llvm-cov, hyperfine, shellcheck, shellspec)
        uses: jdx/mise-action@v2

      - name: Install rustfmt and clippy components
        # mise's rust backend installs rustc + cargo only; rustfmt and clippy
        # are rustup-managed components that need an explicit add.
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: shellcheck
        run: shellcheck bench/baselines/*.sh bench/fixtures/*.sh tools/*.sh

      # shellspec step deferred — see docs/roadmap.md.
      # The perf test invokes both bash baselines via hyperfine, so a broken
      # baseline still surfaces (wildly wrong ratio or non-zero exit).

      # perf_floors_hold is excluded on CI: the hard floors (see CLAUDE.md)
      # were calibrated on the dev host, and shared runners sit right at the
      # 2x pure-bash floor (Linux bash starts faster than macOS bash, and
      # runner noise tips 2.0x to ~1.8x intermittently). The floors stay
      # enforced by any local `cargo nextest run --release`; CI asserts
      # correctness, not wall-clock ratios it cannot measure honestly.
      - name: nextest (release)
        run: cargo nextest run --release -E 'not test(perf_floors_hold)'

      - name: coverage
        run: |
          cargo llvm-cov nextest --lcov --output-path coverage.lcov -E 'not test(perf_floors_hold)'
          tools/check-coverage.sh coverage.lcov

      - name: musl static build
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl

      - name: musl smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --rm \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/lup:/usr/local/bin/lup:ro" \
            -v "$PWD:/work:ro" \
            -w /work \
            alpine:3 \
            sh -c "echo 'TEST=1' > /tmp/.env && cd /tmp && lup -r .env"
