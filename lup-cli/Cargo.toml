[package]
name = "lup-cli"
description = "lup: walk up the directory hierarchy looking for a path, from the shell."
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lup"
path = "src/main.rs"

[dependencies]
liblup = { path = "../liblup", version = "0.2.0" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
