[tools]
rust = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
hyperfine = "latest"
shellcheck = "latest"
shellspec = "latest"
# samply: dev-host profiling tool. Install with `cargo install samply` outside mise
# (mise's cargo backend currently fails to resolve the toolchain for it on this host).

[env]
RUST_BACKTRACE = "1"
